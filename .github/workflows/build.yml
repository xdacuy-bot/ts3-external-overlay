name: build-windows-x64
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Get official TeamSpeak 3 Plugin SDK
        shell: cmd
        run: git clone --depth 1 https://github.com/teamspeak/ts3client-pluginsdk.git sdk
      - name: Compile bridge
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS=%%I
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /LD /O2 /I"sdk\include" plugin.c /Fe:TS3ExternalOverlayBridge_win64.dll
      - name: Package
        shell: powershell
        run: |
          @'
          Set s=CreateObject("WScript.Shell")
          p=Replace(WScript.ScriptFullName,"INICIAR OVERLAY.vbs","overlay.ps1")
          s.Run "powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File """ & p & """",0,False
          '@ | Set-Content 'INICIAR OVERLAY.vbs'
          New-Item package -ItemType Directory -Force | Out-Null
          Copy-Item TS3ExternalOverlayBridge_win64.dll,overlay.ps1,'INICIAR OVERLAY.vbs' package
          @'
          1) Copia TS3ExternalOverlayBridge_win64.dll a %APPDATA%\TS3Client\plugins\
          2) Reinicia TeamSpeak 3 y habilita TS3 External Overlay Bridge.
          3) Ejecuta INICIAR OVERLAY.vbs.
          4) Deshabilita el overlay/plugin viejo para evitar duplicados.
          '@ | Set-Content package\LEEME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TS3-External-Overlay
          path: package
